<script>
        const compounds = [
            {name:"Gypsum (CaSO₄·2H₂O)", val:-1.583, pct:3,  level:"#16A34A"},
            {name:"Anhydrite (CaSO₄)",   val:-1.886, pct:1,  level:"#16A34A"},
            {name:"Calcite (CaCO₃)",     val:-0.077, pct:84, level:"#D97706"},
            {name:"Barite (BaSO₄)",      val:-0.131, pct:74, level:"#D97706"},
            {name:"Celestite (SrSO₄)",   val:-1.699, pct:2,  level:"#16A34A"},
            {name:"Fluorite (CaF₂)",     val:-1.468, pct:3,  level:"#16A34A"},
            {name:"Silica (SiO₂)",       val:-0.811, pct:15, level:"#16A34A"},
            {name:"Iron (Fe(OH)₃)",      val:1.067,  pct:1168, level:"#DC2626", warn:true},
            {name:"Aluminium (Al(OH)₃)", val:-1.361, pct:4,  level:"#16A34A"},
            {name:"Pyrolusite (MnO₂)",   val:-11.363,pct:0,  level:"#16A34A"},
            {name:"Hydroxyapatite",      val:-2.115, pct:1,  level:"#16A34A"},
        ];

        const grid = document.getElementById('compoundGrid');
        compounds.forEach(c => {
            const card = document.createElement('div');
            card.className = 'compound-card';
            card.innerHTML = `
                <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-tight mb-2 opacity-70 truncate" title="${c.name}">${c.name}</p>
                <div class="flex items-end justify-between">
                    <div class="text-[20px] font-black tracking-tight" style="color: ${c.level}">
                        ${c.val.toFixed(3)}
                        ${c.warn ? '<span class="ml-1 text-[16px]">⚠️</span>' : ''}
                    </div>
                    <div class="text-[11px] font-bold text-on-surface-variant bg-surface-container-low px-1.5 py-0.5 rounded">
                        ${c.pct}%
                    </div>
                </div>`;
            grid.appendChild(card);
        });

        // ---- SVG bar chart ----
        const chartData = [
            {label:"Gypsum",    val:-1.58},
            {label:"Anhydrite", val:-1.89},
            {label:"Calcite",   val:-0.08, marker:true},
            {label:"Barite",    val:-0.13},
            {label:"Celestite", val:-1.70},
            {label:"Fluorite",  val:-1.47},
            {label:"Silica",    val:-0.81},
            {label:"Fe(OH)₃",   val:1.07},
            {label:"Al(OH)₃",   val:-1.36},
            {label:"Pyrolusite",val:-11.36},
            {label:"H-apatite", val:-2.12},
        ];

        const svg = document.getElementById('satChart');
        const W=500, H=300, padL=40, padR=20, padT=30, padB=80; // Increased padB for label rotation
        const plotW = W-padL-padR, plotH = H-padT-padB;
        const minV=-12, maxV=2;
        const yScale = v => padT + (maxV - v) / (maxV - minV) * plotH;
        const zeroY = yScale(0);
        const gap = plotW / chartData.length;
        const barW = gap * 0.65;

        let svgContent = '';
        // Gridlines
        [2, 0, -2, -4, -6, -8, -10, -12].forEach(t => {
            const y = yScale(t);
            svgContent += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${t === 0 ? '#CBD5E1' : '#E5E7EB'}" stroke-width="${t === 0 ? 1.5 : 1}"/>`;
            svgContent += `<text x="${padL-10}" y="${y+4}" text-anchor="end" class="axis-label">${t}</text>`;
        });

        chartData.forEach((d, i) => {
            const x = padL + i*gap + (gap-barW)/2;
            const y = Math.min(yScale(d.val), zeroY);
            const h = Math.abs(yScale(d.val) - zeroY);
            const color = d.val > 0 ? '#DC2626' : '#3D53D7';
            
            // Bar
            svgContent += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h, 2)}" rx="2" fill="${color}" fill-opacity="0.9"/>`;
            
            // Marker
            if(d.marker) {
                svgContent += `<circle cx="${x+barW/2}" cy="${yScale(d.val)}" r="5" fill="#DC2626" stroke="#fff" stroke-width="1.5"/>`;
            }

            // Labels rotated to -30 degrees
            svgContent += `
                <g transform="translate(${x+barW/2}, ${H-padB+15})">
                    <text text-anchor="end" transform="rotate(-30)" class="bar-label">${d.label}</text>
                </g>`;
        });

        svg.innerHTML = svgContent;
    </script>
