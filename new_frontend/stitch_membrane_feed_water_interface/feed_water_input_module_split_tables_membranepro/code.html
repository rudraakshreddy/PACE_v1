<style>
        body {
            background-color: #f9f9ff;
            color: #191b23;
        }
        .technical-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        .header-rule {
            border-bottom: 1px solid #e2e8f0;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>

<body class="flex flex-col min-h-screen">
<!-- TopNavBar -->
<header class="flex justify-between items-center w-full px-margin-desktop h-16 z-50 bg-white/95 backdrop-blur-md border-b border-outline-variant sticky top-0">
<div class="flex items-center gap-xl">
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">MembranePro</span>
<nav class="hidden md:flex gap-lg h-full items-center mt-1">
<a class="text-primary border-b-2 border-primary pb-1 transition-all duration-200 font-label-sm text-label-sm" href="#">Feed Data</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors pb-1 font-label-sm text-label-sm" href="#">Scaling &amp; Fouling Analysis</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors pb-1 font-label-sm text-label-sm" href="#">Process Recommendation</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors pb-1 font-label-sm text-label-sm" href="#">Calculation</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors pb-1 font-label-sm text-label-sm" href="#">Performance Decline</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors pb-1 font-label-sm text-label-sm" href="#">Report</a>
</nav>
</div>
<div class="flex items-center gap-md">
<button class="flex items-center px-md py-xs bg-primary text-white rounded-lg shadow-sm font-label-md text-label-md hover:brightness-110 active:scale-95 transition-all">
<span class="material-symbols-outlined mr-xs">play_arrow</span>
            Run Calculation
        </button>
<div class="flex gap-sm">
<span class="material-symbols-outlined cursor-pointer hover:bg-surface-container-high p-xs rounded transition-colors text-on-surface-variant" data-icon="settings">settings</span>
<span class="material-symbols-outlined cursor-pointer hover:bg-surface-container-high p-xs rounded transition-colors text-on-surface-variant" data-icon="help">help</span>
<span class="material-symbols-outlined cursor-pointer hover:bg-surface-container-high p-xs rounded transition-colors text-on-surface-variant" data-icon="account_circle">account_circle</span>
</div>
</div>
</header>
<main class="flex-1 px-margin-desktop py-md space-y-md overflow-y-auto custom-scrollbar"></main>
<script>
    // Micro-interactions for buttons
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
        btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
        btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
    });

    // Simple table edit visual feedback
    document.querySelectorAll('input[type="number"]').forEach(input => {
        input.addEventListener('change', () => {
            input.classList.add('border-primary');
            setTimeout(() => {
                input.classList.remove('border-primary');
            }, 1000);
        });
    });
</script>
</body></html>
